name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: node scripts/check-publication.mts

  native-rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt -- --check
      - run: cargo +stable test --locked
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable test --locked --test cpu_docker -- --ignored
      - run: rustfmt +stable --edition=2024 --check gpu_ssh/start.rs
      - run: rustc +stable --edition=2024 --test gpu_ssh/start.rs -o "$RUNNER_TEMP/cbgpu-entrypoint-test"
      - run: "$RUNNER_TEMP/cbgpu-entrypoint-test"
