[package]
name = "cbgpu-gpu-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.89"
[dependencies]
fs2 = "0.4"
libc = "0.2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
russh = { version = "=0.65.1", default-features = false, features = ["ring"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
sha2 = "0.11"
rand = "0.8"
async-trait = "0.1"
argon2 = "0.5"
tempfile = "3"
[dev-dependencies]

[[test]]
name = "ssh_gateway"
path = "tests/native/ssh_gateway.rs"

[[test]]
name = "controller"
path = "tests/native/controller.rs"

[[test]]
name = "cpu"
path = "tests/native/cpu.rs"

[[test]]
name = "backend"
path = "tests/native/backend.rs"

[[test]]
name = "cli"
path = "tests/native/cli.rs"

[[test]]
name = "cpu_docker"
path = "tests/native/cpu_docker.rs"

[[test]]
name = "process"
path = "tests/native/process.rs"

[[test]]
name = "installer"
path = "tests/native/installer.rs"
