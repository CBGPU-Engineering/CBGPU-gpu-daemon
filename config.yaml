supabase_url: "http://127.0.0.1:54321"
supabase_anon_key: "YOUR_PUBLIC_CLIENT_KEY"

# Supabase 폴링 주기 (초)
poll_interval_seconds: 30

# Preserve existing notebooks during the first native controller observation.
initialize_idle_containers: false

# Docker 설정 (컨테이너 리셋 시 사용)
docker:
  image: "cbgpu/gpu-ssh:latest"
  ssh_host_keys_dir: "/home/cbgpu/.local/share/cbgpu/gpu-ssh"
  school_bind_address: "10.138.23.12" # 교내 전용 CPU 프로젝트가 사용할 서버 NIC 주소
  container_port: 8888  # 컨테이너 내부 포트 (보통 8888 고정)

# GPU ID → 컨테이너 설정 매핑
gpus:
  1:
    username: "gpu1"
    container: "jupiterhub_gpu1"
    device: "0"
    host_port: 8001
    ssh_port: 2201
  2:
    username: "gpu2"
    container: "jupiterhub_gpu2"
    device: "1"
    host_port: 8002
    ssh_port: 2202
  3:
    username: "gpu3"
    container: "jupiterhub_gpu3"
    device: "2"
    host_port: 8003
    ssh_port: 2203
  4:
    username: "gpu4"
    container: "jupiterhub_gpu4"
    device: "3"
    host_port: 8004
    ssh_port: 2204
